<ng-template #paw>
  <svg class="paw" viewBox="0 0 64 64" aria-hidden="true">
    <ellipse cx="32" cy="44" rx="15" ry="12"/>
    <ellipse cx="13" cy="28" rx="6" ry="8"/>
    <ellipse cx="25" cy="16" rx="6" ry="8"/>
    <ellipse cx="39" cy="16" rx="6" ry="8"/>
    <ellipse cx="51" cy="28" rx="6" ry="8"/>
  </svg>
</ng-template>
<div class="card" role="group" [attr.aria-label]="'Bingo card ' + number()" [class.won]="won()" [attr.data-tier]="tier()">
  <p class="title">Card {{ number() }}@if (won()) { <strong class="ribbon" [attr.aria-label]="extent()">{{ title() }}@if (lines() > 1) { <small> ×{{ lines() }}</small> }</strong> }</p>
  <div class="headers" aria-hidden="true">
    @for (letter of letters; track letter) {
      <span class="header" [attr.data-letter]="letter">{{ letter }}</span>
    }
  </div>
  <div class="grid">
    @for (cell of cells(); track cell.index) {
      <button
        type="button"
        class="cell"
        [class.winning]="cell.winning"
        [class.missed]="cell.missed"
        [attr.data-state]="cell.state"
        [attr.aria-label]="cell.label"
        [disabled]="cell.state !== 'ready'"
        (click)="daub.emit(cell.ball!)"
      >
        @if (cell.state === 'marked' || cell.state === 'free') {
          <ng-container [ngTemplateOutlet]="paw" />
        }
        @if (cell.ball !== null) {
          <span class="number">{{ cell.ball }}</span>
        }
      </button>
    }
  </div>
</div>
