name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build FoxTales.Api -c Release --no-restore
      - run: dotnet test --project FoxTales.Api.Tests -c Release --no-restore
